name: CI

# Fast feedback on every push and PR: typecheck, build and the lerp/fallback
# contract checks. Kept separate from pages.yml (deploy) on purpose.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:lerp
